{% if page > 1 or has_next %}<nav class="mt-4" aria-label="Pagination"><ul class="pagination justify-content-center">{% if page > 1 %}<li class="page-item"><a class="page-link" href="{{ page_url(page-1) }}">Previous</a></li>{% endif %}<li class="page-item active"><span class="page-link">{{ page }}</span></li>{% if has_next %}<li class="page-item"><a class="page-link" href="{{ page_url(page+1) }}">Next</a></li>{% endif %}</ul></nav>{% endif %}
