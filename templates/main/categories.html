{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="text-center mb-5"><h1 class="fw-bold">Browse service categories</h1><p class="text-muted">Explore real services listed in the Localjoin database.</p></div><div class="row g-4">{% for c in categories %}<div class="col-6 col-md-4 col-lg-3"><a class="text-decoration-none text-dark" href="{{ lc_url('search.php?category=' ~ c.id) }}"><div class="soft-card p-4 h-100 text-center"><div class="feature-icon mx-auto mb-3"><i class="fa-solid {{ c.icon or 'fa-wrench' }}"></i></div><h5>{{ c.name }}</h5><small class="text-muted">{{ c.service_count }} services</small></div></a></div>{% endfor %}</div></div>{% endblock %}
