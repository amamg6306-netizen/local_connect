{% extends 'base.html' %}
{% block content %}<div class="container py-5" style="max-width:720px"><h1>Report {{ target_type }}</h1><form method="post" class="card card-body shadow-sm border-0"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="type" value="{{ target_type }}"><input type="hidden" name="id" value="{{ target_id }}"><label class="form-label">Reason</label><select name="reason" class="form-select mb-3" required><option value="">Select reason</option><option value="fake_profile">Fake profile</option><option value="wrong_information">Wrong information</option><option value="spam">Spam</option><option value="fraud_concern">Fraud/scam concern</option><option value="inappropriate_content">Inappropriate content</option><option value="other">Other</option></select><label class="form-label">Details</label><textarea name="details" class="form-control mb-3" rows="4" maxlength="2000"></textarea><button class="btn btn-danger">Submit report</button></form></div>{% endblock %}
