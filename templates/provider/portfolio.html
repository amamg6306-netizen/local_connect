{% extends 'base.html' %}
{% block content %}
<div class="container py-5"><h1 class="fw-bold">Work portfolio</h1><p class="text-muted">Upload examples of your own work.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data" class="soft-card p-4 mb-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-2"><div class="col-md-5"><input type="file" class="form-control" name="image" required accept="image/jpeg,image/png,image/webp"></div><div class="col-md-5"><input class="form-control" name="caption" maxlength="255" placeholder="Caption"></div><div class="col-md-2 d-grid"><button class="btn btn-primary">Upload</button></div></div></form><div class="row g-3">{% for i in images %}<div class="col-md-4"><div class="soft-card p-2"><img class="portfolio-img" loading="lazy" src="{{ lc_url(i.image_path) }}" alt=""><div class="p-2">{{ i.caption or 'Work sample' }}</div></div></div>{% endfor %}</div>{% include 'partials/pagination.html' %}</div>
{% endblock %}
