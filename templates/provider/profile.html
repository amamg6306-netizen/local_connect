{% extends 'base.html' %}
{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-9"><div class="d-flex justify-content-between mb-4"><div><h1 class="fw-bold">Provider profile</h1><p class="text-muted">Build the profile customers will discover in search.</p></div><a class="btn btn-outline-primary align-self-start" href="{{ lc_url('provider.php?id=' ~ user.id) }}">Public View</a></div>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data" class="soft-card p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-8"><label class="form-label">Professional headline *</label><input class="form-control" name="headline" required value="{{ profile.headline or '' }}" placeholder="Electrician & home wiring specialist"></div><div class="col-md-4"><label class="form-label">Experience (years)</label><input type="number" min="0" class="form-control" name="experience_years" value="{{ profile.experience_years or 0 }}"></div><div class="col-12"><label class="form-label">About *</label><textarea class="form-control" rows="4" name="about" required>{{ profile.about or '' }}</textarea></div><div class="col-md-6"><label class="form-label">Service area *</label><input class="form-control" name="service_area" required value="{{ profile.service_area or '' }}"></div><div class="col-md-6"><label class="form-label">Working hours</label><input class="form-control" name="working_hours" value="{{ profile.working_hours or '' }}" placeholder="Mon-Sat, 9 AM-7 PM"></div><div class="col-md-4"><label class="form-label">Availability</label><select class="form-select" name="availability_status"><option value="available" {% if profile.availability_status == 'available' %}selected{% endif %}>Available</option><option value="busy" {% if profile.availability_status == 'busy' %}selected{% endif %}>Busy</option><option value="unavailable" {% if profile.availability_status == 'unavailable' %}selected{% endif %}>Unavailable</option></select></div><div class="col-md-4"><label class="form-label">Price from ₹</label><input type="number" min="0" step="0.01" class="form-control" name="price_min" value="{{ profile.price_min if profile.price_min is not none else '' }}"></div><div class="col-md-4"><label class="form-label">Price to ₹</label><input type="number" min="0" step="0.01" class="form-control" name="price_max" value="{{ profile.price_max if profile.price_max is not none else '' }}"></div><div class="col-md-4"><label class="form-label">City *</label><input class="form-control" name="city" required value="{{ user.city or '' }}"></div><div class="col-md-4"><label class="form-label">State *</label><input class="form-control" name="state" required value="{{ user.state or '' }}"></div><div class="col-md-2"><label class="form-label">Area</label><input class="form-control" name="area" value="{{ user.area or '' }}"></div><div class="col-md-2"><label class="form-label">Pincode</label><input class="form-control" name="pincode" value="{{ user.pincode or '' }}"></div><div class="col-12"><label class="form-label">Profile image</label><input type="file" class="form-control" name="profile_image" accept="image/jpeg,image/png,image/webp"><small class="text-muted">JPG, PNG or WEBP, max 3 MB.</small></div><div class="col-12"><button class="btn btn-primary">Save Profile</button></div></div></form></div></div></div>{% endblock %}
