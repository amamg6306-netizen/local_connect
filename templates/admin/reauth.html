{% extends 'base.html' %}{% block content %}<div class="container auth-wrap py-5"><div class="soft-card p-4 p-md-5"><h2 class="fw-bold">Confirm sensitive admin access</h2><p class="text-muted">Re-enter your password. This confirmation expires after 10 minutes.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="return" value="{{ return_path }}"><input class="form-control" type="password" name="password" required autocomplete="current-password"><button class="btn btn-primary w-100 mt-3">Confirm</button></form></div></div>{% endblock %}
