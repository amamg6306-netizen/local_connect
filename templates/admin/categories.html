{% extends 'base.html' %}{% block content %}<div class="container py-4">{% include 'partials/admin_nav.html' %}<h1>Categories</h1><form method="post" class="card card-body shadow-sm border-0 mb-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-2"><div class="col-md-5"><input class="form-control" name="name" maxlength="120" placeholder="New category name" required></div><div class="col-md-4"><input class="form-control" name="icon" maxlength="80" value="fa-tag" placeholder="Font Awesome icon"></div><div class="col-md-3"><button class="btn btn-primary w-100">Add category</button></div></div></form><div class="table-responsive"><table class="table"><tr><th>Name</th><th>Slug</th><th>Active</th><th>Delete</th></tr>{% for r in rows %}<tr><td>{{ r.name }}</td><td>{{ r.slug }}</td><td>{{ 'Yes' if r.is_active else 'No' }}</td><td><form method="post" data-confirm-submit="Delete this category?"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="id" value="{{ r.id }}"><button name="action" value="delete" class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}</table></div></div>{% endblock %}
