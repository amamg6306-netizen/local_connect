{% extends 'base.html' %}{% block content %}<div class="container py-4">{% include 'partials/admin_nav.html' %}<h1>Manage businesses</h1><div class="table-responsive card border-0 shadow-sm"><table class="table mb-0"><tr><th>Name</th><th>Account</th><th>Verification</th><th>Action</th></tr>{% for r in rows %}<tr><td>{{ r.display_name }}<div class="small text-muted">{{ r.email }}</div></td><td>{{ r.status }}</td><td>{{ r.verification_status }}</td><td><form method="post" class="d-flex gap-1"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="user_id" value="{{ r.id }}"><button name="status" value="verified" class="btn btn-sm btn-success">Verify</button><button name="status" value="rejected" class="btn btn-sm btn-outline-danger">Reject</button><button name="status" value="pending" class="btn btn-sm btn-outline-secondary">Pending</button></form></td></tr>{% endfor %}</table></div>{% include 'partials/pagination.html' %}</div>{% endblock %}
