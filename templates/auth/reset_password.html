{% extends 'base.html' %}{% block content %}<div class="container auth-wrap py-5"><div class="soft-card p-4 p-md-5"><h2 class="fw-bold">Choose a new password</h2>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}{% if not record %}<div class="alert alert-warning">This reset link is invalid or expired. <a href="{{ lc_url('auth/forgot-password.php') }}">Request another link</a>.</div>{% else %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="selector" value="{{ selector }}"><input type="hidden" name="token" value="{{ token }}"><label class="form-label">New password</label><input class="form-control" type="password" name="password" minlength="12" maxlength="200" required autocomplete="new-password"><label class="form-label mt-3">Confirm new password</label><input class="form-control" type="password" name="confirm_password" maxlength="200" required autocomplete="new-password"><button class="btn btn-primary w-100 mt-3">Update password</button></form>{% endif %}</div></div>{% endblock %}
