{% extends 'base.html' %}
{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-9"><div class="d-flex justify-content-between mb-4"><div><h1 class="fw-bold">Business profile</h1><p class="text-muted">Complete your public business listing.</p></div><a class="btn btn-outline-primary align-self-start" href="{{ lc_url('business.php?id=' ~ user.id) }}">Public View</a></div>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data" class="soft-card p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-8"><label class="form-label">Business name *</label><input class="form-control" name="business_name" required value="{{ profile.business_name or '' }}"></div><div class="col-md-4"><label class="form-label">Category *</label><select class="form-select" name="category_id" required><option value="">Select</option>{% for c in categories %}<option value="{{ c.id }}" {% if profile.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Description *</label><textarea class="form-control" rows="4" name="description" required>{{ profile.description or '' }}</textarea></div><div class="col-12"><label class="form-label">Address *</label><input class="form-control" name="address" required value="{{ profile.address or '' }}"></div><div class="col-md-4"><label class="form-label">City *</label><input class="form-control" name="city" required value="{{ user.city or '' }}"></div><div class="col-md-4"><label class="form-label">State *</label><input class="form-control" name="state" required value="{{ user.state or '' }}"></div><div class="col-md-2"><label class="form-label">Area</label><input class="form-control" name="area" value="{{ user.area or '' }}"></div><div class="col-md-2"><label class="form-label">Pincode</label><input class="form-control" name="pincode" value="{{ user.pincode or '' }}"></div><div class="col-md-4"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ profile.phone or user.phone or '' }}"></div><div class="col-md-4"><label class="form-label">Opening time</label><input type="time" class="form-control" name="opening_time" value="{{ profile.opening_time.strftime('%H:%M:%S') if profile.opening_time else '' }}"></div><div class="col-md-4"><label class="form-label">Closing time</label><input type="time" class="form-control" name="closing_time" value="{{ profile.closing_time.strftime('%H:%M:%S') if profile.closing_time else '' }}"></div><div class="col-md-4"><label class="form-label">Price from ₹</label><input type="number" min="0" class="form-control" name="price_min" value="{{ profile.price_min if profile.price_min is not none else '' }}"></div><div class="col-md-4"><label class="form-label">Price to ₹</label><input type="number" min="0" class="form-control" name="price_max" value="{{ profile.price_max if profile.price_max is not none else '' }}"></div><div class="col-md-4"><label class="form-label">Website</label><input type="url" class="form-control" name="website" value="{{ profile.website or '' }}"></div><div class="col-12"><label class="form-label">Logo / photo</label><input type="file" class="form-control" name="logo" accept="image/jpeg,image/png,image/webp"></div><div class="col-12"><button class="btn btn-primary">Save Business Profile</button></div></div></form></div></div></div>{% endblock %}
